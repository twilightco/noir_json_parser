name: Noir tests

on:
  push:
    branches:
      - main
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # This fork pins its toolchain. The lookup tables and the error-state encoding depend
  # on compiler behaviour (out-of-bounds reads as unsatisfiable constraints, brillig
  # constraint checking), so "whatever nargo released this week" is not a test matrix we
  # can read a green tick from.
  NOIR_VERSION: 1.0.0-beta.26

jobs:
  test:
    name: Test on Nargo ${{ env.NOIR_VERSION }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Nargo
        uses: noir-lang/noirup@v0.1.3
        with:
          toolchain: ${{ env.NOIR_VERSION }}

      - name: Run Noir tests
        run: nargo test

  soundness:
    name: No missing Brillig constraints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Nargo
        uses: noir-lang/noirup@v0.1.4
        with:
          toolchain: ${{ env.NOIR_VERSION }}

      # `bug:` is the compiler saying a value from an unconstrained function reaches
      # constrained code without being pinned to its inputs -- the shape of every
      # soundness bug this branch fixed. The check is on by default and
      # `--skip-brillig-constraints-check` must never be used here.
      #
      # This job used to grep `nargo check` output for it, which CANNOT WORK: the lint
      # runs on monomorphised code and a library has nothing to monomorphise. The script
      # compiles a real bin consumer instead, and then re-compiles it against a copy of
      # the library carrying a deliberately uncovered call -- if the lint fails to catch
      # that, the job fails, because a check that cannot fail is worse than no check.
      - name: Brillig constraint coverage
        run: ./scripts/brillig-constraints-check.sh

  tables:
    name: Lookup tables reproduce from their generators
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Nargo
        uses: noir-lang/noirup@v0.1.3
        with:
          toolchain: ${{ env.NOIR_VERSION }}

      # Two halves of the same claim. The verifiers check the committed tables against
      # the sub-tables; the round trip checks that the emitters and the splicer still
      # reproduce the committed file byte for byte, so a hand-edit of the generated file
      # cannot pass by agreeing with itself.
      - name: Verify committed tables
        run: nargo test test_make

      - name: Regenerate and diff
        run: |
          set -o pipefail
          nargo test --show-output emit_table_ | grep '^EMIT ' > tables.txt
          python3 scripts/splice_tables.py tables.txt src/json_tables.nr
          git diff --exit-code -- src/json_tables.nr

  corpus:
    name: Conformance corpus agrees with a reference parser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Nargo
        uses: noir-lang/noirup@v0.1.4
        with:
          toolchain: ${{ env.NOIR_VERSION }}

      # Two claims. The committed baseline must still be what the generator produces --
      # otherwise a case could be edited into agreement -- and the parser must still
      # agree with it. A row that changes is a decision somebody has to justify in the
      # diff, which is the entire point of committing `corpus/cases.json`.
      - name: Baseline is up to date
        run: python3 corpus/generate.py --check

      - name: Parser agrees with the corpus
        run: "nargo test conformance::"

  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Nargo
        uses: noir-lang/noirup@v0.1.3
        with:
          toolchain: ${{ env.NOIR_VERSION }}
      - name: Run formatter
        run: nargo fmt --check

  # This is a job which depends on all test jobs and reports the overall status.
  # This allows us to add/remove test jobs without having to update the required workflows.
  tests-end:
    name: Noir End
    runs-on: ubuntu-latest
    # We want this job to always run (even if the dependant jobs fail) as we want this job to fail rather than skipping.
    if: ${{ always() }}
    needs:
      - test
      - format
      - soundness
      - tables
      - corpus

    steps:
      - name: Report overall success
        run: |
          if [[ $FAIL == true ]]; then
              exit 1
          else
              exit 0
          fi
        env:
          # We treat any cancelled, skipped or failing jobs as a failure for the workflow as a whole.
          FAIL: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
